
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Olnar Bingo Mini App</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f8;
            color: #172f43;
            min-height: 100vh;
        }

        header {
            background: #172f43;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 6px;
        }

        header p {
            opacity: 0.85;
        }

        main {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .card h2,
        .card h3 {
            margin-bottom: 12px;
        }

        .card p {
            margin-bottom: 15px;
            line-height: 1.5;
        }

        button {
            font-family: Arial, sans-serif;
            cursor: pointer;
        }

        .primary-button,
        .secondary-button,
        .bingo-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
        }

        .primary-button {
            background: #1976d2;
            color: white;
        }

        .secondary-button {
            background: #e7edf3;
            color: #172f43;
        }

        .bingo-button {
            background: #d62828;
            color: white;
            font-size: 20px;
            padding: 18px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccd5dd;
            border-radius: 10px;
            font-size: 16px;
            margin-top: 8px;
        }

        .wallet {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: #f2f5f8;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .wallet strong {
            color: #1976d2;
        }

        .game-header {
            text-align: center;
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
        }

        #calledNumber {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 60px;
            height: 60px;
            margin: 10px;
            border-radius: 50%;
            background: #172f43;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .bingo-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .board-number {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 42px;
            background: #edf1f5;
            border-radius: 7px;
            font-weight: bold;
        }

        .board-number.called {
            background: #1976d2;
            color: white;
        }

        .bingo-card-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-bottom: 5px;
            text-align: center;
            font-weight: bold;
            color: #1976d2;
        }

        .player-card {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .bingo-cell {
            aspect-ratio: 1 / 1;
            border: 1px solid #ccd5dd;
            border-radius: 8px;
            background: white;
            font-size: 15px;
            font-weight: bold;
        }

        .bingo-cell.marked {
            background: #1976d2;
            color: white;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #6b7280;
        }

        @media (max-width: 400px) {

            main {
                padding: 12px;
            }

            .card {
                padding: 15px;
            }

            .bingo-cell {
                font-size: 12px;
            }

            .board-number {
                min-height: 36px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎱 Olnar Bingo</h1>
    <p>Play Bingo with friends</p>
</header>


<main>

    <!-- HOME PAGE -->
    <section id="homePage" class="page active">

        <div class="card">

            <h2>Welcome to Olnar Bingo</h2>

            <p>
                Create a Bingo room or join an existing room.
            </p>

            <button
                id="createRoomButton"
                class="primary-button">
                Create Bingo Room
            </button>

            <button
                id="joinRoomButton"
                class="secondary-button">
                Join Bingo Room
            </button>

            <button
                id="referralButton"
                class="secondary-button">
                Copy Referral Link
            </button>

        </div>


        <!-- WALLET -->

        <div class="card">

            <h2>Wallet</h2>

            <div class="wallet">

                <span>Balance</span>

                <strong id="walletBalance">
                    0 ETB
                </strong>

            </div>

            <button
                id="depositButton"
                class="primary-button">
                Deposit
            </button>

            <button
                id="withdrawButton"
                class="secondary-button">
                Withdraw
            </button>

        </div>

    </section>


    <!-- ROOM PAGE -->

    <section id="roomPage" class="page">

        <div class="card">

            <h2>Join Bingo Room</h2>

            <p>
                Enter the room code shared by your friend.
            </p>

            <input
                id="roomCode"
                type="text"
                placeholder="Enter room code">

            <button
                id="enterRoomButton"
                class="primary-button">
                Enter Room
            </button>

            <button
                id="backHomeButton"
                class="secondary-button">
                Back Home
            </button>

        </div>

    </section>


    <!-- GAME PAGE -->

    <section id="gamePage" class="page">

        <div class="game-header">

            <h2>Live Bingo</h2>

            <p>
                Called Number:
            </p>

            <strong id="calledNumber">
                --
            </strong>

            <button
                id="callNumberButton"
                class="primary-button">
                Call Number
            </button>

        </div>


        <!-- BINGO BOARD -->

        <div class="card">

            <h3>Live Bingo Board</h3>

            <div
                id="bingoBoard"
                class="bingo-board">
            </div>

        </div>


        <!-- PLAYER CARD -->

        <div class="card">

            <h3>Your Bingo Card</h3>

            <div class="bingo-card-header">

                <span>B</span>
                <span>I</span>
                <span>N</span>
                <span>G</span>
                <span>O</span>

            </div>

            <div
                id="playerCard"
                class="player-card">
            </div>

            <button
                id="bingoButton"
                class="bingo-button">
                BINGO!
            </button>

        </div>


        <button
            id="leaveRoomButton"
            class="secondary-button">
            Leave Room
        </button>

    </section>

</main>


<footer>

    <p>
        © 2026 Olnar Bingo
    </p>

</footer>


<!-- IMPORTANT: LOAD YOUR JAVASCRIPT FILE -->
<script src="app.js"></script>

</body>
</html>
